[workspace]
resolver = "2"
members = [
    "crates/h33-core",
    "crates/h33-render",
    "crates/h33-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Math
glam = "0.30"
# TRNG (seed uniquement) — API OS natives : getrandom(2)/dev/urandom (Linux), BCryptGenRandom (Windows)
getrandom = "0.3"
# GPU
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
wgpu = "24"
winit = "0.30"
# UI
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
# Capture d'écran (tests)
png = "0.17"
# Assets 3D (glTF/GLB exportés depuis Blender)
gltf = "1.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
